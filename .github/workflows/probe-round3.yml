name: 探针-黄金看板跨资产源

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  round3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 出口 IP
        run: curl -s --max-time 10 https://api.ipify.org || true
      - name: 实测银/油/铜/BTC 与比值对齐
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/probe_round3.py
      - name: 打印摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('probe-report3.json',encoding='utf-8'))
          print('=== 序列 ===')
          for x in d['sources']:
              print('%-10s %-14s ok=%-5s rows=%-6s %s -> %s last=%s %s'%(
                  x['symbol'],x['label'],x.get('ok'),x.get('rows',0),x.get('first'),x.get('last'),
                  x.get('last_close'),x.get('err','')[:80]))
          print('=== 比值（共同交易日对齐）===')
          for k,v in d['ratios'].items(): print(k,v)
          print('=== 五资产归一共同交易日 ===', d.get('normalized_curve_days'))
          print('=== GVZ ===', d.get('gvz'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report3
          path: probe-report3.json
          retention-days: 14
      - name: 回写报告
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe-report3.json
          git diff --cached --quiet || (git commit -m "chore: 黄金看板跨资产源探针 $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
