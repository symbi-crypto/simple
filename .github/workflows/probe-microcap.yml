name: 探针-微盘股截面数据完整性

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注'
        required: false
        default: 'microcap cross-section probe'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 真拉东财全A截面并逐项统计
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/probe_microcap.py

      - name: 打印结论摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          d = json.load(open('probe-microcap.json', encoding='utf-8'))
          print('出口IP:', d.get('exit_ip'), ' 请求 pz=', d.get('request_pz'),
                ' status=', d.get('status'), ' 耗时=', d.get('sec'), ' err=', d.get('err'))
          print('行数:', d.get('rows'), ' 声明total:', d.get('declared_total'), ' 前三:', d.get('first3'))
          print('字段非空:', {k: v['nonnull'] for k, v in d.get('fields', {}).items()})
          s = d.get('snapshot') or {}
          print('总市值有效:', s.get('cap_nonnull'), '/', s.get('rows'),
                ' 停牌:', s.get('price_missing_suspended'),
                ' ST:', s.get('st_name_count'), ' 上市日期有效:', s.get('listing_date_ok'))
          print('最小400只:', s.get('small400'))
          print('昨收市值口径重合:', s.get('prevclose_cap_overlap_with_small400'))
          print('全市场等权当日涨跌:', s.get('equal_weight_daily_return_pct'))
          print('--- 结论 ---')
          print(json.dumps(d.get('summary'), ensure_ascii=False, indent=2))
          PY

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-microcap
          path: probe-microcap.json
          retention-days: 14

      - name: 回写报告到仓库
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe-microcap.json
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
          else
            git commit -m "chore: 微盘股截面探针报告 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
