name: 探针-微盘股截面数据完整性

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注'
        required: false
        default: 'microcap variant matrix'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [100_nout, 1000_nout, 10000_nout, 50000_nout, 10000_withut, 100_withut]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 单请求实测 ${{ matrix.variant }}
        env:
          PYTHONIOENCODING: utf-8
          VARIANT: ${{ matrix.variant }}
        run: python scripts/probe_microcap.py
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: var-${{ matrix.variant }}
          path: probe-var-${{ matrix.variant }}.json
          retention-days: 7

  collect:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: var-*
          merge-multiple: true
          path: collected
      - name: 合并汇总
        run: |
          python - <<'PY'
          import json, glob, os
          out = []
          for f in sorted(glob.glob('collected/probe-var-*.json')):
              d = json.load(open(f, encoding='utf-8'))
              out.append(d)
              print('%-16s pz=%-6s ut=%-5s status=%-5s rows=%-6s total=%-6s cap=%-6s st=%-4s date=%-5s err=%s' % (
                  d['variant'], d['pz'], d['use_ut'], d['status'], d['rows'],
                  d['declared_total'], d.get('cap_nonnull'), d.get('st_count'),
                  d.get('date_ok'), str(d.get('err'))[:50]))
          out.sort(key=lambda x: (x['pz'], x['use_ut']))
          json.dump({'results': out}, open('probe-matrix.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=2)
          print('---- MATRIX ----')
          for d in out:
              print('%-16s status=%-5s rows=%-6s total=%-6s err=%s' % (
                  d['variant'], d['status'], d['rows'], d['declared_total'], str(d.get('err'))[:60]))
          PY
      - name: 回写汇总报告
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, base64, urllib.request, urllib.error, os
          tok = os.environ['GH_TOKEN']; repo = os.environ['GITHUB_REPOSITORY']
          api = 'https://api.github.com/repos/%s/contents/probe-matrix.json' % repo
          hdr = {'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json',
                 'User-Agent': 'probe', 'X-GitHub-Api-Version': '2022-11-28'}
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(api, headers=hdr), timeout=20) as r:
                  sha = json.loads(r.read().decode()).get('sha')
          except Exception:
              pass
          body = {'message': 'chore: 微盘股 pz/ut 变体矩阵汇总',
                  'content': base64.b64encode(open('probe-matrix.json', 'rb').read()).decode(),
                  'branch': 'main'}
          if sha: body['sha'] = sha
          req = urllib.request.Request(api, data=json.dumps(body).encode(), method='PUT',
                                       headers=dict(hdr, **{'Content-Type': 'application/json'}))
          try:
              with urllib.request.urlopen(req, timeout=30) as r: print('PUT', r.status)
          except urllib.error.HTTPError as e: print('PUT HTTP', e.code, e.read().decode()[:200])
          PY
