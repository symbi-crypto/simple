name: 探针-微盘股截面数据完整性

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注'
        required: false
        default: 'microcap cross-section probe'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 真拉东财全A截面并逐项统计
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/probe_microcap.py

      - name: 打印结论摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          d = json.load(open('probe-microcap.json', encoding='utf-8'))
          print('出口 IP:', d.get('exit_ip'))
          print('字段完整性:')
          for k, v in d.get('fields', {}).items():
              print('   %-6s present=%-6s nonnull=%-6s missing=%s' % (k, v['present'], v['nonnull'], v['missing']))
          s = d.get('snapshot') or {}
          print('快照: rows=%s total=%s cap_ok=%s cap_missing=%s price_missing=%s ST=%s date_ok=%s eqret=%s' % (
              s.get('rows'), s.get('declared_total'), s.get('cap_nonnull'),
              s.get('cap_missing_or_zero'), s.get('price_missing_suspended'),
              s.get('st_name_count'), s.get('listing_date_ok'), s.get('equal_weight_daily_return_pct')))
          print('小市值400:', s.get('small400'))
          print('昨收市值口径重合:', s.get('prevclose_cap_overlap_with_small400'))
          print('此前观察:', d.get('prior_observations'))
          pg = d.get('pages', {})
          print('分页: 尝试 %s 页 / 失败 %s 页 / 耗时 %ss / 实拉 %s' % (
              pg.get('pages_attempted'), pg.get('fail_pages'), pg.get('elapsed_sec'), pg.get('rows_fetched')))
          print('历史截面测试:')
          for h in d.get('history', []):
              print('   ', h.get('test'), 'status=', h.get('status'), 'same_as_today=', h.get('same_as_today'),
                    'rows=', h.get('rows'), 'err=', str(h.get('err'))[:60])
          print('结论:', d.get('summary'))
          PY

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-microcap
          path: probe-microcap.json
          retention-days: 14

      - name: 回写报告到仓库
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe-microcap.json
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
          else
            git commit -m "chore: 微盘股截面探针报告 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
