name: 探针-微盘股截面数据完整性

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注'
        required: false
        default: 'microcap pz matrix'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        pz: [100, 1000, 10000, 50000]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 单请求实测 pz=${{ matrix.pz }}
        env:
          PYTHONIOENCODING: utf-8
          PZ: ${{ matrix.pz }}
        run: python scripts/probe_microcap.py

      - name: 打印结果
        if: always()
        run: cat probe-pz-${{ matrix.pz }}.json || echo "无报告"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-pz-${{ matrix.pz }}
          path: probe-pz-${{ matrix.pz }}.json
          retention-days: 14
