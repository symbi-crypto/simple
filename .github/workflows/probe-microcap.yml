name: 探针-微盘股截面数据完整性

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注'
        required: false
        default: 'microcap cross-section probe'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装可选依赖（AKShare，用于验证现成接口）
        run: python -m pip install -q akshare || echo "akshare 安装失败，跳过现成接口验证"

      - name: 真拉东财全A截面并逐项统计
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/probe_microcap.py

      - name: 打印结论摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          d = json.load(open('probe-microcap.json', encoding='utf-8'))
          print('出口 IP:', d.get('exit_ip'))
          print('此前观察:', d.get('prior'))
          print('--- pn 交替序列 ---')
          for x in d.get('seq_pn', []):
              print('   %-38s status=%-5s rows=%-4s total=%-6s first=%-8s err=%s' % (
                  x['tag'], x['status'], x['rows'], x['total'], x['first'], str(x['err'])[:50]))
          print('--- 批量备选 / fs切分 / 重复 ---')
          print('ulist.np:', d.get('ulist'))
          for x in d.get('fs_split', []):
              print('   %-14s status=%-5s rows=%-4s total=%s err=%s' % (
                  x['tag'], x['status'], x['rows'], x['total'], str(x['err'])[:50]))
          for x in d.get('seq_repeat', []):
              print('   %-14s status=%-5s rows=%s err=%s' % (x['tag'], x['status'], x['rows'], str(x['err'])[:50]))
          print('AKShare:', d.get('akshare'))
          print('--- 诊断 ---')
          print(json.dumps(d.get('diagnosis'), ensure_ascii=False, indent=2))
          PY

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-microcap
          path: probe-microcap.json
          retention-days: 14

      - name: 回写报告到仓库
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe-microcap.json
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
          else
            git commit -m "chore: 微盘股截面探针报告 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
