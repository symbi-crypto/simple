name: 每周行情同步

# 北京时间 周五 17:37（UTC 09:37），每周一次。
# 选周五收盘后：周末打开站点就是本周完整数据；避开整点，减少 Actions 排队被跳过。
# 一次点击会把「上次末日 → 今天」之间所有交易日一次补齐，漏跑一周下次也会自动补上。
# 想换时间只改下面 cron 一行（GitHub cron 用 UTC）；想临时补跑用 Actions 页 Run workflow。
#
# 三条链（按资产族收敛，上游源不合并，合并的是落库契约）：
#   L 本地 gz    → cb-daily.json / index-daily.json                 零抓取、含退市债
#   A 东财+申万  → industry / market-amount / us-etf-daily.json      A股行业、成交额、美股ETF
#   G Yahoo+CBOE → gold-daily.json                                  境外商品与波动率
# 每条链独立跑、独立失败、独立写状态；一条红灯不牵连其它链写回，提交步用 always() 兜底。
on:
  schedule:
    - cron: '37 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wufu-weekly-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 装无头浏览器（零依赖，不改仓库文件）
        run: |
          npm install --no-save --no-package-lock playwright@1.49.0
          npx playwright install chromium

      - name: 起本地站点（不走公网，避开花生壳访问策略拦截）
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory . > /tmp/wufu-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/index.html -o /dev/null && { echo "本地站点已就绪"; break; }
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/index.html -o /dev/null || { cat /tmp/wufu-http.log; exit 1; }

      - name: 跑取数 → 生成 state.json（链 L 的输入）
        env:
          SITE_URL: http://127.0.0.1:8787
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          STEP_TIMEOUT_MS: ${{ vars.STEP_TIMEOUT_MS }}
        run: node scripts/update.mjs

      # ---------------- 链 L：本地 gz，零抓取 ----------------
      - name: 链 L · 本地看板快照（可转债 / 指数）
        if: always()
        run: node scripts/build-dashboards.mjs

      # ---------------- 链 A：东财 + 申万 ----------------
      - name: 安装申万行业数据源（链 A 专用）
        run: python3 -m pip install --quiet akshare==1.18.88

      - name: 链 A · 申万一级行业宽度 + 两市成交额
        if: always()
        id: chain_a_industry
        run: python3 scripts/build-external.py --chain=A

      - name: 链 A · 美股 ETF 日线（周度只追加新交易日）
        if: always()
        id: chain_a_us
        run: python3 scripts/build-us-etf.py

      # ---------------- 链 G：Yahoo + CBOE ----------------
      - name: 链 G · 国际金/银/油/铜/BTC + GVZ
        if: always()
        id: chain_g
        run: python3 scripts/build-external.py --chain=G

      # ---------------- 汇总 + 提交：任何链失败都照常收口 ----------------
      - name: 汇总三条链状态（明确标失败，不绿灯伪装）
        if: always()
        run: python3 scripts/merge-chain-status.py || true

      - name: 有变化才提交（没变化不触发 Netlify 构建）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="sync-status.json cb-daily.json index-daily.json industry-daily.json gold-daily.json market-amount.json us-etf-daily.json external-warnings.json external-warnings-L.json external-warnings-A.json external-warnings-G.json"
          CHANGED=""
          for f in $FILES; do [ -f "$f" ] && git add "$f" && CHANGED="$CHANGED $f"; done
          if [ -f state.json ]; then git add state.json; fi
          if git diff --cached --quiet; then
            echo "本周没有任何变化，不提交、不触发构建。"
            exit 0
          fi
          git commit -m "chore: 周度同步 $(date -u +%F)（三条链 L/A/G）"
          git push
