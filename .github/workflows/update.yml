name: 每周行情同步

# 北京时间 周五 17:37（UTC 09:37），每周一次。
# 选周五收盘后：周末打开站点就是本周完整数据；避开整点，减少 Actions 排队被跳过。
# 一次点击会把「上次末日 → 今天」之间所有交易日一次补齐，漏跑一周下次也会自动补上。
# 想换时间只改下面 cron 一行（GitHub cron 用 UTC）；想临时补跑用 Actions 页 Run workflow。
on:
  schedule:
    - cron: '37 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wufu-weekly-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 装无头浏览器（零依赖，不改仓库文件）
        run: |
          npm install --no-save --no-package-lock playwright@1.49.0
          npx playwright install chromium

      - name: 起本地站点（不走公网，避开花生壳访问策略拦截）
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory . > /tmp/wufu-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/index.html -o /dev/null && { echo "本地站点已就绪"; break; }
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/index.html -o /dev/null || { cat /tmp/wufu-http.log; exit 1; }

      - name: 跑取数 → 生成 state.json
        env:
          SITE_URL: http://127.0.0.1:8787
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          STEP_TIMEOUT_MS: ${{ vars.STEP_TIMEOUT_MS }}
        run: node scripts/update.mjs

      - name: 生成本地看板快照（可转债 / 指数）
        run: node scripts/build-dashboards.mjs

      - name: 抓取并计算行业宽度 + 黄金快照
        run: python3 scripts/build-external.py

      - name: 有变化才提交（没变化不触发 Netlify 构建）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- state.json sync-status.json cb-daily.json index-daily.json industry-daily.json gold-daily.json)" ]; then
            echo "本周没有任何变化，不提交、不触发构建。"
            exit 0
          fi
          git add sync-status.json cb-daily.json index-daily.json industry-daily.json gold-daily.json external-warnings.json
          if [ -f state.json ]; then git add state.json; fi
          git commit -m "chore: 周度同步 $(date -u +%F)"
          git push
