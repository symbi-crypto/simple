name: 探针-数据源细核

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  round2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 细核行业板块全量与疑似误判源
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/probe_round2.py
      - name: 打印摘要
        run: |
          python - <<'PY'
          import json
          d=json.load(open('probe-report2.json',encoding='utf-8'))
          i=d['industry']
          print('板块清单 total=%s 取回=%s 页数=%s'%(i['board_list_total'],i['board_list_fetched'],i['pages']))
          print('日线尝试=%s 成功=%s 行数=%s..%s'%(i['kline_attempted'],i['kline_ok'],i['kline_rows_min'],i['kline_rows_max']))
          print('末日期分布:',i['kline_last_dates'])
          print('可做31行热力图:',i['can_do_31_row_heatmap'])
          print('样例板块:',i['sample_boards'])
          print('--- 误判源坐实 ---')
          for c in d['clarifications']:
              print(c['id'],c['status'],c['bytes'],(c.get('extract') or c['sample'])[:160])
          print('--- FRED ---')
          for x in d['fred']: print(x['id'],x['status'],x['bytes'],x['sample'][:90])
          print('--- SPDR ---')
          for x in d['spdr']: print(x['id'],x['status'],x['bytes'],x['sample'][:90])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: probe-report2
          path: probe-report2.json
          retention-days: 14
      - name: 回写报告
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe-report2.json
          git diff --cached --quiet || (git commit -m "chore: 数据源细核报告 $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
