name: 探针-数据源可达性

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注'
        required: false
        default: 'manual probe'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装可选依赖（AKShare，用于复现文章做法）
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q requests akshare || echo "pip 部分依赖安装失败，继续跑纯 HTTP 探针"

      - name: 逐个真拉数据源
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/probe_sources.py

      - name: 打印结论摘要
        run: |
          python - <<'PY'
          import json
          d = json.load(open('probe-report.json', encoding='utf-8'))
          print('出口 IP :', d['exit_ip'])
          print('行业可用:', d['summary']['industry_ok'])
          print('黄金可用:', d['summary']['gold_ok'])
          print('-' * 100)
          for s in d['sources']:
              print('%-9s %-22s status=%-5s ok=%-5s rows=%-6s %s -> %s %s' % (
                  s['group'], s['id'], str(s['status']), str(s['ok']), str(s['rows']),
                  str(s['first'])[:12], str(s['last'])[:12], (s['err'] or s['detail'])[:60]))
          print('-' * 100)
          for s in d['sources']:
              if not s['ok']:
                  print('[FAIL] %-22s %-6s %s' % (s['id'], str(s['status']), s['sample'][:120]))
          PY

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: probe-report.json
          retention-days: 14

      - name: 回写报告到仓库
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe-report.json
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
          else
            git commit -m "chore: 数据源探针报告 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
