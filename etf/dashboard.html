<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF量化回测系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7490'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%23fff' font-family='serif'%3E福%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../common/header.css">
<link rel="stylesheet" href="../common/dashboard.css">
<style>
:root{--bg:#1B2634;--card:#202E3F;--line:#243244;--edge:#3E4E63;--ink:#F1F5F9;--mut:#9FB0C3;--gray:#7C8DA1;--acc:#4FC3F7;--acc2:#22D3EE;--up:#F87171;--down:#34D399;--purple:#A78BFA;--amber:#FBBF24;--radius:10px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.nav{display:flex;gap:5px;padding:10px 16px 0;max-width:1280px;margin:0 auto;width:100%;box-sizing:border-box;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button,.nav a{font-size:11.5px;padding:6px 8px;flex:0 0 auto;white-space:nowrap;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--card);color:var(--mut);cursor:pointer;text-decoration:none;display:inline-block}
.nav button.on,.nav a.on{background:var(--acc);color:#fff;font-weight:600}
</style>
</head><body>
<script src="../common/header.js" data-t1="ETF量化" data-t2="回测系统" data-badge="none" data-page="etf"></script>
<div class="nav">
  <button type="button" class="on">综合看板</button>
  <a href="index.html#/correlation">相关性</a>
  <a href="index.html#/ic">因子IC</a>
  <a href="index.html#/rotation">轮动回测</a>
  <a href="index.html#/rebalance">再平衡回测</a>
  <a href="index.html#/dca">定投回测</a>
  <a href="index.html#/strategies">我的策略</a>
</div>
<div class="wrap" id="dashWrap" data-kind="idx" data-json="../index-daily.json">
  <div class="card" id="c2">
    <div class="hd"><b>指数看板</b><span>—</span></div>
    <div class="sumline" id="idxSum">加载中…</div>
    <div class="ghead" style="margin-top:11px"><b>指数统计<span class="gname">—</span></b>
      <span class="seg" data-seg><span class="on" data-y="5">5年</span><span data-y="10">10年</span></span></div>
    <div class="ghead" style="margin-top:8px"><b><span style="color:#4FC3F7">A股</span><span class="gname">—</span></b></div>
    <div class="idx" id="idxA"></div>
    <div class="ghead" style="margin-top:10px"><b><span style="color:#A78BFA">港股</span><span class="gname">—</span></b><span>各自交易日</span></div>
    <div class="idx" id="idxH"></div>
    <div class="ghead" style="margin-top:10px"><b><span style="color:#9FB0C3">美股</span><span class="gname">—</span></b><span>各自交易日</span></div>
    <div class="idx" id="idxU"></div>
    <div class="more" onclick="tg('c2')"><span>沪深300 / 国证2000 · 历史对比</span><span class="arw">▾</span></div>
    <div class="detail">
      <div class="chartbox">
        <div class="chartcap"><b>沪深300 / 国证2000</b><span>起点归一 = 100</span></div>
        <svg viewBox="0 0 360 150" id="idxChart" role="img" aria-label="沪深300与国证2000历史对比"></svg>
        <div class="legend">
          <span><i style="background:#4FC3F7"></i>沪深300（大盘）</span>
          <span><i style="background:#F87171"></i>国证2000（小盘）</span>
        </div>
      </div>
      <div class="subnote" id="idxSampleNote" style="margin:8px 0 0">—</div>
      <div class="subnote" style="margin:6px 0 0">两条线各自归一 = 100，只比形状位置，不混算数值；右列分位为当前点位在所选窗口历史点位中的百分位。</div>
    </div>
  </div>
</div>
<script src="../common/dashboard.js"></script>
</body></html>
