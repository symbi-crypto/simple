/* v0.62 · 看板已并入系统主文档。直接打开旧地址时跳到主文档的「综合看板」页签；
   ?embed=1 时作为主文档内嵌视图，只渲染看板本体（顶栏由 header.js 自动省略）。 */
(function(){
  if (!/[?&]embed=1(?:&|$)/.test(location.search)) {
    location.replace('tool.html#/gold');

    document.documentElement.classList.add('db-embed');
  }
})();
</script>

<script>
(function(){
  if (!document.documentElement.classList.contains('db-embed')) return;
  var t = null;
  function post(){
    try{
      var h = Math.max(document.documentElement.scrollHeight,
                       document.body ? document.body.scrollHeight : 0);
      if (h > 0) parent.postMessage({ wufuDashHeight: h }, '*');
    }catch(e){}
  }
  function soon(){ clearTimeout(t); t = setTimeout(post, 60); setTimeout(post, 260); setTimeout(post, 700); }
  window.addEventListener('load', post);
  window.addEventListener('resize', soon);
  window.addEventListener('orientationchange', soon);
  window.addEventListener('message', function(e){ if (e && e.data && e.data.wufuDashQuery) post(); });
  document.addEventListener('click', function(){ setTimeout(post, 80); setTimeout(post, 360); }, true);
  try{ new MutationObserver(soon).observe(document.body, {attributes:true,childList:true,subtree:true,characterData:true}); }catch(e){}
  try{ if (window.ResizeObserver) new ResizeObserver(soon).observe(document.body); }catch(e){}
  var n = 0, iv = setInterval(function(){ post(); if (++n > 14) clearInterval(iv); }, 700);
  post(); soon();
})();
</script>
