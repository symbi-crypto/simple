<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF量化回测系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7490'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%23fff' font-family='serif'%3E福%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../common/header.css">
<link rel="stylesheet" href="../common/dashboard.css">
<style>
:root{--bg:#1B2634;--card:#202E3F;--line:#243244;--edge:#3E4E63;--ink:#F1F5F9;--mut:#9FB0C3;--gray:#7C8DA1;--acc:#4FC3F7;--acc2:#22D3EE;--up:#F87171;--down:#34D399;--amber:#FBBF24;--radius:10px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.nav{display:flex;gap:5px;padding:10px 16px 0;max-width:1280px;margin:0 auto;width:100%;box-sizing:border-box;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button,.nav a{font-size:11.5px;padding:6px 8px;flex:0 0 auto;white-space:nowrap;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--card);color:var(--mut);cursor:pointer;text-decoration:none;display:inline-block}
.nav button.on,.nav a.on{background:var(--acc);color:#fff;font-weight:600}
.gsum b{font-size:13.5px;font-variant-numeric:tabular-nums}
.gsum i{font-style:normal;color:var(--gray);margin:0 5px}
.gsum .sm{font-size:11px;color:var(--mut)}
.gsum .sm b{font-size:12px}
.gkv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.gkv small{font-size:10px;font-weight:400;color:var(--mut)}
.gempty{font-size:11px;color:var(--mut);padding:8px 0}
</style>
</head><body>
<script src="../common/header.js" data-t1="ETF量化" data-t2="回测系统" data-badge="none" data-page="etf"></script>
<div class="nav">
  <a href="dashboard.html">综合看板</a>
  <button type="button" class="on">黄金看板</button>
  <a href="index.html#/correlation">相关性</a>
  <a href="index.html#/ic">因子IC</a>
  <a href="index.html#/rotation">轮动回测</a>
  <a href="index.html#/rebalance">再平衡回测</a>
  <a href="index.html#/dca">定投回测</a>
  <a href="index.html#/strategies">我的策略</a>
</div>
<div class="wrap" id="goldWrap" data-json="../gold-daily.json">
  <div class="card" id="g1">
    <div class="hd"><b>黄金看板</b><span>—</span></div>
    <div class="sumline gsum" id="gSum">加载中…</div>
    <div class="subnote" style="margin:7px 0 0">金／银／油／铜为 COMEX 期货主力连续、BTC 为美元价；比价按国际美元价计算，上海金仅作人民币对照、不参与比价。</div>
    <div class="more" onclick="tg('g1')"><span>当日概览 · 合并趋势 · 波动 · 位置</span><span class="arw">▾</span></div>
    <div class="detail">

      <div class="blk">
        <div class="sec"><span>当日概览 · 六项</span>
          <span class="seg" data-gseg><span class="on" data-y="5">5年</span><span data-y="10">10年</span></span></div>
        <div class="kpi" id="gKpi"></div>
      </div>

      <div class="blk">
        <div class="sec"><b>合并趋势</b>
          <span class="seg" data-mseg><span class="on" data-m="price">价格</span><span data-m="ratio">比价</span></span></div>
        <div class="chartbox">
          <div class="chartcap"><b id="gTitle">五资产价格</b><span>起点归一 = 100</span></div>
          <svg viewBox="0 0 360 158" id="gMain" role="img" aria-label="黄金看板合并趋势"></svg>
          <div class="legend" id="gLegend"></div>
        </div>
        <div class="subnote" id="gSample" style="margin:6px 0 0">—</div>
      </div>

      <div class="blk">
        <div class="sec"><b>黄金波动率 GVZ</b><span>独立量纲</span></div>
        <div class="chartbox">
          <svg viewBox="0 0 360 96" id="gGvz" role="img" aria-label="GVZ 波动率曲线"></svg>
        </div>
      </div>

      <div class="blk">
        <div class="sec"><b>位置分位</b><span id="gPosNote">近 5 年</span></div>
        <div id="gPos"></div>
      </div>

    </div>
  </div>
</div>
<script src="../common/gold.js"></script>
</body></html>
