<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据体检中心</title>
<meta name="theme-color" content="#0E7490">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7490'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%23fff' font-family='serif'%3E福%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../common/hub.css">
<style>
.loadhint{flex:none;font-size:11px;color:#9FB0C3;padding:8px 16px 0;line-height:1.6}
</style>
<link rel="stylesheet" href="../common/header.css">
</head>
<body class="frame-page">
<script src="../common/header.js" data-t1="数据" data-t2="体检中心" data-badge="asof" data-page="health" data-export="1"></script>

<div class="hubtabs" id="htabs">
  <button type="button" class="on" data-sys="etf">ETF 系统 · 数据体检</button>
  <button type="button" data-sys="cb">可转债系统 · 数据体检</button>
  <button type="button" data-sys="manage">ETF系统·其他功能</button>
</div>
<div class="loadhint" id="hload">首次打开需加载行情数据（可转债约 17 MB），请稍候…</div>

<div class="frame-wrap">
  <iframe id="hframeEtf" src="../etf/tool.html?view=health#/health" title="ETF 系统 · 数据体检"></iframe>
  <iframe id="hframeCb" data-src="../cb/tool.html?view=health#/health" title="可转债系统 · 数据体检" style="display:none"></iframe>
  <iframe id="hframeManage" data-src="../etf/manage.html" title="ETF系统·其他功能" style="display:none"></iframe>
</div>

<script src="../common/storage.js"></script>
<script src="../common/health-config.js"></script>
<script src="../common/hub-core.js"></script>
<script src="../common/export.js"></script>
<script>
(function(){
  "use strict";
  var H=window.WufuHub, $=function(id){return document.getElementById(id);};
  var frames={etf:$("hframeEtf"),cb:$("hframeCb"),manage:$("hframeManage")};
  var cur="etf", lastAsOf={etf:"",cb:""};   /* 卸载 iframe 前记下真实数据末日，右上角不跟着乱跳 */
  function frameAsOf(k){
    try{
      var w=frames[k]&&frames[k].contentWindow;
      var d=w&&w.WufuUI&&w.WufuUI.getData&&w.WufuUI.getData();
      return d&&d.calendar&&d.calendar.length?String(d.calendar[d.calendar.length-1]).slice(0,10):"";
    }catch(e){return "";}
  }
  function render(){
    /* 两套系统共用同一套日期参数：优先读 iframe 里真实行情末日，
       卸载后沿用卸载前记下的真值，最后才回退统一键 */
    $("asofEtf").textContent=frameAsOf("etf")||lastAsOf.etf||H.DateSync.read("etf")||"—";
    $("asofCb").textContent=frameAsOf("cb")||lastAsOf.cb||H.DateSync.read("cb")||"—";
  }
  function hint(){
    $("hload").style.display=(cur==="manage"||frames[cur].getAttribute("data-ready"))?"none":"block";
  }
  /* 切页签时把不用的 iframe 真正卸载：三个大页面不再同时驻留内存，
     否则刚更新完（内存最高）再切一下，手机 Chrome 会直接崩成「无法打开此网页」。 */
  function unload(k){
    var f=frames[k]; if(!f) return;
    var a=frameAsOf(k); if(a) lastAsOf[k]=a;
    try { f.src="about:blank"; } catch(e){}
    f.removeAttribute("src");       /* 下次切入时从 data-src 重新加载（SW 已缓存，不重新下载） */
    f.removeAttribute("data-ready");
    f.style.display="none";
  }
  function showFrame(s){
    Object.keys(frames).forEach(function(k){ if(k!==s) unload(k); });
    var f=frames[s];
    if(!f.getAttribute("src")){
      void f.offsetWidth; /* 强制布局，避免隐藏 iframe 的首次 src 被浏览器丢弃 */
      f.src=f.getAttribute("data-src");
    }
    f.style.display="block";
  }
  Object.keys(frames).forEach(function(k){
    frames[k].addEventListener("load",function(){
      if(!frames[k].getAttribute("src")) return;  /* about:blank 卸载触发的 load，不算就绪 */
      frames[k].setAttribute("data-ready","1");
      setTimeout(render,300);
      if(k===cur)hint();
    });
  });
  document.querySelectorAll("#htabs button[data-sys]").forEach(function(b){
    b.addEventListener("click",function(){
      var s=b.getAttribute("data-sys");
      document.querySelectorAll("#htabs button[data-sys]").forEach(function(z){z.className="";});
      b.className="on";
      cur=s;
      showFrame(s);
      render();hint();
    });
  });
  $("hframeEtf").addEventListener("load",function(){setTimeout(render,300);});
  window.addEventListener("pageshow",render);
  window.addEventListener("storage",render);
  setInterval(render,H.DateSync.TICK);
  render();hint();
})();
(function(){
  var b=document.getElementById("btnExport");
  if(b && window.WufuExport) b.addEventListener("click",function(){ window.WufuExport.download(); });
})();
</script>
</body>
</html>
